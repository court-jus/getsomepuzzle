name: Build Branch
on:
  workflow_dispatch:
  push:
    branches: [develop]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    name: Prepare version suffix
    outputs:
      slug: ${{ steps.slug.outputs.slug }}
    steps:
      - name: Compute timestamp suffix
        id: slug
        run: |
          SLUG=$(date -u '+%y%m%d%H%M')
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "Slug: $SLUG"

  check:
    needs: [prepare]
    runs-on: ubuntu-latest
    name: Check
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Run tests
        run: flutter test

  build-apk:
    needs: [prepare, check]
    runs-on: ubuntu-latest
    name: Build APK
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - name: Patch version with branch slug
        env:
          SLUG: ${{ needs.prepare.outputs.slug }}
        run: |
          sed -i -E "s/^version: ([0-9]+\.[0-9]+\.[0-9]+)(.*)$/version: \1-${SLUG}\2/" pubspec.yaml
          sed -i -E "s/const versionText = \"Version ([0-9]+\.[0-9]+\.[0-9]+)\";/const versionText = \"Version \1-${SLUG}\";/" lib/main.dart
          grep '^version: ' pubspec.yaml
          grep 'const versionText' lib/main.dart
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApkReleases-${{ needs.prepare.outputs.slug }}
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    needs: [prepare, check]
    runs-on: windows-latest
    name: Build Windows
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - name: Patch version with branch slug
        shell: bash
        env:
          SLUG: ${{ needs.prepare.outputs.slug }}
        run: |
          sed -i -E "s/^version: ([0-9]+\.[0-9]+\.[0-9]+)(.*)$/version: \1-${SLUG}\2/" pubspec.yaml
          sed -i -E "s/const versionText = \"Version ([0-9]+\.[0-9]+\.[0-9]+)\";/const versionText = \"Version \1-${SLUG}\";/" lib/main.dart
          grep '^version: ' pubspec.yaml
          grep 'const versionText' lib/main.dart
      - run: flutter pub get
      - run: flutter build windows
      - name: package
        run: |
          cd build
          tar -czvf windows-build.tgz windows/x64/runner/Release
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsRelease-${{ needs.prepare.outputs.slug }}
          path: build/windows-build.tgz

  build-web:
    needs: [prepare, check]
    runs-on: ubuntu-latest
    name: Build Web
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - name: Patch version with branch slug
        env:
          SLUG: ${{ needs.prepare.outputs.slug }}
        run: |
          sed -i -E "s/^version: ([0-9]+\.[0-9]+\.[0-9]+)(.*)$/version: \1-${SLUG}\2/" pubspec.yaml
          sed -i -E "s/const versionText = \"Version ([0-9]+\.[0-9]+\.[0-9]+)\";/const versionText = \"Version \1-${SLUG}\";/" lib/main.dart
          grep '^version: ' pubspec.yaml
          grep 'const versionText' lib/main.dart
      - run: flutter pub get
      - name: Generate privacy-policy HTML pages
        run: dart run bin/build_privacy.dart
      - run: flutter build web --base-href=/getsomepuzzle/
      - name: package
        run: |
          cd build
          tar -czvf web-build.tgz web
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebRelease-${{ needs.prepare.outputs.slug }}
          path: build/web-build.tgz

  release:
    needs: [prepare, build-apk, build-windows, build-web]
    runs-on: ubuntu-latest
    name: Experimental Release
    steps:
      - uses: actions/checkout@v4
      - name: Extract base version from pubspec.yaml
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | tr -d '\r')
          # Strip the Flutter build-number suffix (+N), same as ci.yml
          BASE="${VERSION%+*}"
          echo "VERSION=$BASE" >> "$GITHUB_ENV"
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ApkReleases-${{ needs.prepare.outputs.slug }}
          path: artifacts/apk
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: WindowsRelease-${{ needs.prepare.outputs.slug }}
          path: artifacts/windows
      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: WebRelease-${{ needs.prepare.outputs.slug }}
          path: artifacts/web
      - name: Rename assets
        env:
          SLUG: ${{ needs.prepare.outputs.slug }}
        run: |
          mv artifacts/apk/app-release.apk "artifacts/apk/getsomepuzzle-v${VERSION}-exp.${SLUG}.apk"
          mv artifacts/windows/windows-build.tgz "artifacts/windows/getsomepuzzle-v${VERSION}-exp.${SLUG}-windows.tgz"
          mv artifacts/web/web-build.tgz "artifacts/web/getsomepuzzle-v${VERSION}-exp.${SLUG}-web.tgz"
      - name: Create Pre-release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.VERSION }}-exp.${{ needs.prepare.outputs.slug }}
          name: v${{ env.VERSION }}-exp.${{ needs.prepare.outputs.slug }}
          prerelease: true
          commitish: ${{ github.sha }}
          artifacts: >-
            artifacts/apk/getsomepuzzle-v${{ env.VERSION }}-exp.${{ needs.prepare.outputs.slug }}.apk,
            artifacts/windows/getsomepuzzle-v${{ env.VERSION }}-exp.${{ needs.prepare.outputs.slug }}-windows.tgz,
            artifacts/web/getsomepuzzle-v${{ env.VERSION }}-exp.${{ needs.prepare.outputs.slug }}-web.tgz

  cleanup-experimental:
    needs: [release]
    runs-on: ubuntu-latest
    name: Cleanup Old Pre-releases
    steps:
      - name: Delete old experimental releases (keep 5)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --json tagName,isPrerelease,createdAt --limit 100 \
            --jq '[.[] | select(.isPrerelease)] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
            | while read tag; do
              echo "Deleting old experimental release: $tag"
              gh release delete "$tag" --yes
            done
